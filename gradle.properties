org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRclass=true

# Enables generating custom resource values (resValue) by default across modules.
android.defaults.buildfeatures.resvalues=true
# Controls whether AGP automatically defaults targetSdk to match compileSdk when left unspecified.
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
# Controls compile-time optimizations for generating application R classes.
android.enableAppCompileTimeRClass=false
# Permits or disallows defining uses-sdk attributes directly in module manifests.
android.usesSdkInManifest.disallowed=false
# Disables the strict requirement that every library module must have a globally unique package name.
android.uniquePackageNames=false
# Enables version constraints when resolving dependencies between Android library modules.
android.dependency.useConstraints=true
# Important for R8/Proguard: Disables strict full-mode optimizations in the R8 code shrinker. Setting this to false relaxes strict checks, which helps prevent app crashes if your Proguard/R8 keep rules aren't 100% strict or if third-party libraries have loose reflection rules.
android.r8.strictFullModeForKeepRules=false
# Disables experimental optimized resource shrinking in R8, falling back to standard resource removal.
android.r8.optimizedResourceShrinking=false
# Disables built-in Kotlin support handled directly by AGP, relying instead on the standard Kotlin Gradle plugin.
android.builtInKotlin=false
# Opts out of experimental new Gradle DSL features, keeping the traditional stability of the Android DSL.
android.newDsl=false
